  - id: downstream-readme-entrypoint
    status: active
    owner: downstream-maintainers
    introduced_commit: a866d1fb328fc4e2a9ae3773f35e77b09a83f0fe
    purpose: Identify the repository as an independently maintained downstream fork from its default README and keep inherited local installation links usable.
    paths:
      - README.md
      - README.en.md
      - README.fr.md
      - README.ja.md
      - README.zh_TW.md
    upstream_touchpoints:
      - default-branch project documentation
      - localized installation guide navigation
    conflict_risk: low
    verification:
      - verify every modified README local link resolves in the repository
      - scripts/agent-runtime/verify.sh docs
    removal_condition: Retain the README.md notice while the fork is independently maintained; remove link-only deviations if the inherited documentation ships equivalent corrections.
    upstream_reference: null

  - id: upstream-price-catalog-phase2
    status: active
    owner: downstream-maintainers
    introduced_commit: 53c316bc182853892af75b693c9d4d9150e47aa7
    purpose: Phase 2 of the upstream price catalog per docs/downstream/upstream-price-catalog-spec.md — billingexpr base-expression projection, the RootAuth cost/sale/margin comparison endpoint, scheduled catalog sync on the existing SystemTask runner (off by default), catalog health alerts, the models.dev / basellm curated reference adapters, the RootAuth adapter listing endpoint, and the §8.3 freshness fields on the source list and comparison responses. It reads sale-pricing configuration for the comparison projection and still writes none of it.
    paths:
      - pkg/billingexpr/compile.go
      - pkg/billingexpr/project.go
      - pkg/billingexpr/project_test.go
      - model/system_task.go
      - controller/system_task_handlers.go
      - service/upstreamprice/alerts.go
      - service/upstreamprice/alerts_test.go
      - service/upstreamprice/compare.go
      - service/upstreamprice/compare_test.go
      - service/upstreamprice/registry_test.go
      - service/upstreamprice/schedule.go
      - service/upstreamprice/schedule_test.go
      - service/upstreamprice/source_test.go
      - service/upstreamprice/adapters/catalog_alerting_test.go
      - service/upstreamprice/adapters/curated_reference.go
      - service/upstreamprice/adapters/curated_reference_test.go
      - service/upstreamprice/adapters/scheduled_sync_test.go
      - service/upstreamprice/adapters/testdata/curated_basellm_sample.json
      - service/upstreamprice/adapters/testdata/curated_models_dev_sample.json
    upstream_touchpoints:
      - billing expression compiler in pkg/billingexpr (shared requestRuleFactor shape detection and cache invalidation)
      - SystemTask type registry in model/system_task.go and scheduled handler registration in controller/system_task_handlers.go
      - RootAuth API route groups /api/upstream-prices and /api/upstream-price-sources in router/api-router.go, including GET /api/upstream-price-sources/adapters
      - sale-pricing read accessors in setting/ratio_setting and setting/billing_setting
    conflict_risk: medium
    verification:
      - go build ./... and go vet ./...
      - go test ./pkg/billingexpr/... ./service/upstreamprice/... ./model ./controller -count=1
      - billingexpr regression asserting RunExpr results and request-rule traces are unchanged by a base-expression projection, in both evaluation orders
      - scheduled sync end-to-end tests asserting byte-identical sale-pricing exports, orphan refusal, and default-off selection
      - scheduled failure semantics tests covering the spec §8.4 table — a pre-plan failure records a lightweight failed run and reaches the consecutive-failure alert, an orphan-check database error fails the pass and backs the source off, and a commit CAS conflict neither backs off nor records a run
    removal_condition: Remove only if the upstream price catalog feature is retired or upstream ships an equivalent comparison, scheduling, and reference-adapter capability.
    upstream_reference: null

